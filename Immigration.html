<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HS USAENGLISH | Immigration Q&A Premium Quiz</title>
<style>
:root{
  --navy:#030b18;
  --navy2:#06172f;
  --blue:#0b3a78;
  --gold:#f5c44b;
  --gold2:#c98b16;
  --silver:#dfe5ef;
  --green:#28c76f;
  --red:#ff5f5f;
  --white:#ffffff;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  color:var(--white);
  background:
    radial-gradient(circle at top, rgba(20,68,130,.9) 0%, rgba(6,23,47,.96) 38%, #020814 100%);
}
header{
  text-align:center;
  padding:20px 10px 18px;
  background:linear-gradient(145deg,rgba(245,196,75,.14),rgba(255,255,255,.04));
  border-bottom:2px solid rgba(245,196,75,.6);
}
.hero{
  width:min(1050px,97%);
  border-radius:18px;
  border:1px solid rgba(245,196,75,.55);
  box-shadow:0 18px 48px rgba(0,0,0,.5);
}
h1{
  margin:18px 0 8px;
  color:var(--gold);
  font-size:clamp(28px,5.6vw,58px);
  text-transform:uppercase;
  text-shadow:0 4px #000;
  letter-spacing:1px;
}
.subtitle{
  color:var(--silver);
  font-size:clamp(16px,2.3vw,24px);
  font-weight:800;
}
main{
  width:min(1120px,94%);
  margin:24px auto 44px;
}
.panel{
  background:rgba(255,255,255,.075);
  border:1px solid rgba(245,196,75,.35);
  border-radius:22px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 14px 36px rgba(0,0,0,.28);
}
.info{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}
.pill{
  background:rgba(0,0,0,.32);
  border:1px solid rgba(255,255,255,.16);
  border-radius:999px;
  padding:12px 14px;
  text-align:center;
  font-weight:900;
}
.progress-wrap{
  margin-top:16px;
  height:22px;
  background:rgba(0,0,0,.48);
  border-radius:999px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.18);
}
.progress{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--gold2),var(--gold),#fff2a8);
  transition:.3s;
}
.question{
  background:linear-gradient(145deg,rgba(255,255,255,.085),rgba(255,255,255,.035));
  border:1px solid rgba(255,255,255,.14);
  border-radius:22px;
  padding:20px;
  margin:16px 0;
}
.qtop{
  display:flex;
  gap:12px;
  align-items:flex-start;
}
.num{
  min-width:44px;
  height:44px;
  border-radius:50%;
  background:linear-gradient(#ffeaa0,var(--gold2));
  color:#06172f;
  display:grid;
  place-items:center;
  font-weight:900;
  font-size:21px;
}
.qtext{
  flex:1;
  font-size:clamp(19px,2.4vw,25px);
  line-height:1.3;
  font-weight:900;
}
.speak{
  border:0;
  cursor:pointer;
  border-radius:999px;
  padding:10px 14px;
  color:#06172f;
  background:linear-gradient(#fff4bf,var(--gold));
  font-weight:900;
}
.options{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-top:16px;
}
.option{
  text-align:left;
  cursor:pointer;
  padding:15px;
  border-radius:15px;
  border:2px solid rgba(255,255,255,.18);
  background:#0c2a54;
  color:white;
  font-size:18px;
  font-weight:800;
  transition:.18s;
}
.option:hover{
  transform:translateY(-2px);
  border-color:var(--gold);
}
.option.correct{
  background:rgba(40,199,111,.24);
  border-color:var(--green);
}
.option.wrong{
  background:rgba(255,95,95,.25);
  border-color:var(--red);
}
.feedback{
  display:none;
  margin-top:14px;
  padding:12px 14px;
  border-radius:12px;
  background:rgba(0,0,0,.3);
  color:var(--silver);
  font-size:17px;
  line-height:1.45;
}
.feedback.show{display:block}
.actions{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:14px;
  margin-top:22px;
}
.mainbtn{
  border:0;
  border-radius:999px;
  padding:15px 24px;
  cursor:pointer;
  background:linear-gradient(#ffeaa0,var(--gold2));
  color:#05152b;
  font-size:18px;
  font-weight:900;
  box-shadow:0 7px 0 #704900;
}
.result{
  display:none;
  text-align:center;
}
.result.show{display:block}
.bigscore{
  font-size:clamp(42px,8vw,82px);
  color:var(--gold);
  font-weight:900;
  text-shadow:0 4px #000;
}
.level-badge{
  display:inline-block
